# Pull-request hygiene: every PR must link a backlog issue, follow the title
# convention, and is auto-assigned to its author and auto-labelled by area.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Require linked issue and title format
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const errors = [];
            if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)) {
              errors.push("PR description must reference its backlog issue, e.g. `Closes #12`.");
            }
            if (!/^\[(US|T)-\d{2}\]\s+.+/.test(pr.title)) {
              errors.push("PR title must start with the backlog ID, e.g. `[US-05] Upload CSV dataset`.");
            }
            if (errors.length) core.setFailed(errors.join("\n"));
            else core.info("PR hygiene checks passed");

      - name: Assign PR to its author
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, assignees: [pr.user.login],
            });

  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
