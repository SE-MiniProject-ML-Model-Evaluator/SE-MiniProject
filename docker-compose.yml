# Run the whole system: docker compose up --build   then open https://localhost
services:
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}
    volumes:
      - app-data:/data
      - static-files:/app/staticfiles
    restart: unless-stopped

  nginx:
    build: ./deploy/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static-files:/app/staticfiles:ro
      - certs:/etc/nginx/certs
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app-data:
  static-files:
  certs:
